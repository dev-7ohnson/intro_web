<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <h1>My Favorite Cities</h1>
    <ul>
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
        <li>New York</li>
        <li>Berlin</li>

    </ul>
    <ol type="i">
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
        <li>New York</li>
        <li>Berlin</li>
    </ol>
</body>
</html>
