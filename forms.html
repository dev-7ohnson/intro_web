<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: #e0ca3c;
        font-family: "Aldrich", sans-serif;
        font-weight: 400;
        font-style: normal;
      }
      form{
        width: 40%;
        border: 1px solid #F34213;
        padding: 16px;
        margin: auto;
        background: #000F08;
      }
      label{
        color: #ffffff;
      }
      .full-width{
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 12px;
        border-radius: 5px;
      }
      button{
        font-family: "Aldrich", sans-serif;
        font-size: 15px;
        width: 100%;
        background: #F34213;
        border-color: #F34213;
        padding: 16px;
        color: #ffffff;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <!-- text, email, password, number, date, radio, checkbox, select, submit -->

    <form>
      <label for="names">Names</label>

      <input
        type="text"
        required
        id="names"
        name="full_name"
        placeholder="Jane Doe"
        class="full-width"
      />

      <br />

      <label for="email">Email</label>

      <input
        type="email"
        required
        id="email"
        name="email"
        placeholder="doe@example.com"
        class="full-width"
      />

      <br />

      <label for="pass">Password</label>

      <input
        type="password"
        required
        id="pass"
        name="pass"
        placeholder="*******"
        class="full-width"
      />

      <br />

      <label for="weight">Weight</label>

      <input
        type="number"
        min="30"
        max="250"
        step="0.01"
        required
        id="weight"
        name="weight"
        placeholder="Weight in Kgs"
        class="full-width"
      />

      <br />

      <label for="dob">Date of Birth</label>

      <input
        type="date"
        min="1940-01-01"
        max="2008-12-31"
        required
        id="dob"
        name="dob"
        class="full-width"
      />

      <!-- name must be the same for radio buttons -->

      <br />

      <label>Select Your Gender</label><br>

      <input type="radio" id="m" name="gender" value="F" />

      <label for="m">Female</label>

      <br />

      <input type="radio" id="f" name="gender" value="M" />

      <label for="f">Male</label>

      <hr />
       <label>Select Your Meal(s)</label>
       <br>
      <input type="checkbox" id="x" name="food" value="P001" />

      <label for="x">Pizza</label>

      <br />

      <input type="checkbox" id="y" name="food" />

      <label for="y">Burger</label>

      <br />

      <input type="checkbox" id="z" name="food" />

      <label for="z">Ugali</label>

      <!-- <p>Lorem ipsum dolor sit amet</p> -->

      <br />

      <label>Select Your Counrty</label>

      <select class="full-width">
        <option>Select County</option>

        <option value="1">Mombasa</option>

        <option value="2">Nairobi</option>

        <option value="3">Nyeri</option>

        <option value="4">Kisumu</option>

        <option value="5">Kisii</option>
      </select>

      <br />

      <button>Register</button>
    </form>
  </body>
</html>
